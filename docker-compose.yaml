services:
  web:
    build: .
    image: m0st4f468/tech-mag:${TAG:-latest}
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - api

  api:
    image: m0st4f468/tech-mag:${TAG:-latest}
    command: npm run api
    ports:
      - "4000:4000"
    volumes:
      - ./db.json:/app/db.json